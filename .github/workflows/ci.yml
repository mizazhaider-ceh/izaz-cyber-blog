# CI for izaz.dev
# Audit item 50. Runs on every pull request and on push to master.
# Steps: install, typecheck, build, then Lighthouse CI against the
# production server. No package is added for Lighthouse CI, it runs
# through npx so package.json is untouched.

name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/next-server.log 2>&1 &
          echo $! > /tmp/next-server.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000 > /dev/null; then
              echo "Server is responding on http://localhost:3000."
              exit 0
            fi
            sleep 2
          done
          echo "Server did not respond in time."
          cat /tmp/next-server.log
          exit 1

      - name: Run Lighthouse CI
        run: npx -y @lhci/cli@latest autorun --config=lighthouserc.json

      - name: Stop production server
        if: always()
        run: kill "$(cat /tmp/next-server.pid)" || true
